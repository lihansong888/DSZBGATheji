name: Sync HUYA Source

on:
  push:
    branches: [ main ]
    paths:
      - 'watchtv/live.py'
      - '.github/workflows/live.yml'
  workflow_dispatch:
    inputs:
      skip_check:
        description: '跳过链接检测（调试用，检测结果异常少时可试试）'
        type: boolean
        default: false
      force:
        description: '结果比上次少很多时也强制覆盖'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

# 允许工作流把结果提交回仓库
permissions:
  contents: write

# 避免两次运行同时推送
concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      # ffprobe 用来检查画面（排除黑屏、只有声音的源）
      - name: Install ffmpeg
        run: |
          command -v ffprobe >/dev/null || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)

      - name: Generate live files
        env:
          SKIP_CHECK: ${{ inputs.skip_check && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python watchtv/live.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchtv/live.m3u8 watchtv/live.txt
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "auto update live files"
            git pull --rebase origin main
            git push origin main
          fi
